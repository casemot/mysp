<style>
body {
  font-family: sans-serif;
  margin: 0;
  padding: 24px;
  text-align: center;
  background: #f7f7f7;
}
#controls {
  margin-bottom: 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
}
#grid-wrapper {
  display: flex;
  justify-content: center;
}
#grid {
  display: inline-block;
  background: #111;
  border: 2px solid #555;
  padding: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  position: relative;
  overflow: hidden;
  /* Marbre noir avec veines blanches aléatoires */
  background-image:
    radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    radial-gradient(rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 50px 50px, 30px 30px;
  background-blend-mode: overlay;
}
.row { display: flex; }
.cell {
  width: 30px;
  height: 30px;
  border: 1px solid #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  box-sizing: border-box;
}
.header-cell { background: #111; color: #bbb; font-weight: 600; }
.empty { background: #111; color: transparent; }

/* Lettres hébraïques nettes et saphir avec scintillement animé */
.hebrew-letter {
  color: #66c0ff; /* bleu plus clair et contrasté */
  font-family: 'Noto Serif Hebrew', serif;
  font-weight: 700;
  font-size: 20px;
  text-shadow:
    0 0 0.3px #66c0ff,
    0 0 0.5px #99d0ff;
  /*animation: sparkle 2s infinite alternate;*/
}

.hebrew-letter:hover {
  text-shadow:
    0 0 0.5px #66c0ff,
    0 0 1.2px #99d0ff,
    0 0 2px #b3e0ff; /* léger scintillement au survol */
}

@keyframes sparkle {
  0% {
    text-shadow: 0 0 0.3px #66c0ff, 0 0 0.5px #99d0ff, 0 0 1px #b3e0ff;
  }
  50% {
    text-shadow: 0 0 0.5px #66c0ff, 0 0 0.8px #99d0ff, 0 0 2px #b3e0ff;
  }
  100% {
    text-shadow: 0 0 0.3px #66c0ff, 0 0 0.5px #99d0ff, 0 0 1px #b3e0ff;
  }
}
 
.highlight-main {
  outline: 1px solid rgba(102,192,255,0.8);
  box-shadow: 0 0 3px rgba(102,192,255,0.5);
}
</style>

function ar(t){const a=[];for(let s=1;s<t-1;s++){a.push(((s-(t%s)===1&&s<3)||(t%s===0))?s*Math.round(t/s):s*(Math.round(t/s)<2?Math.round(t/s)+2:Math.round(t/s)+1));}a.push((t-1)*(Math.round(t/(t-1))+1),t);return a.flat();}
function cev(s){const a=ar(667),v=a[s-1],c=Math.round(v/2/s)+((Math.round(v/2/s)%2===0)?2:1);return Math.round(c%(v/s));}
function ceh(s){const a=ar(667),v=a[s-1];return(Math.round((v/s-667)/2)===0)?1:Math.round((v-667)/2);}

function renderGrid(s){
  document.getElementById('sval').textContent=s;
  const container=document.getElementById('grid');
  container.innerHTML='';
  const prefix=ceh(s),stream=new Array(prefix).fill('').concat(la.slice());
  const totalRows=Math.ceil(stream.length/s); while(stream.length<totalRows*s) stream.push('');
  const hRow=ceh(s)%totalRows, hCol=cev(s)%s;
  const mainIndex=prefix+333;

  // header colonnes
  const headerRow=document.createElement('div');
  headerRow.className='row';
  headerRow.style.direction='rtl';
  for(let i=1;i<=s;i++){
    const h=document.createElement('div');
    h.className='cell header-cell';
    h.textContent=i;
    headerRow.appendChild(h);
  }
  container.appendChild(headerRow);

  // lignes
  let letterCount=0;
  const totalLetters = la.length;
  const rows=[];
  for(let r=0;r<totalRows;r++){
    const row=document.createElement('div');
    row.className='row';
    for(let c=0;c<s;c++){
      const idx=r*s+c;
      const cell=document.createElement('div');
      cell.className='cell';
      if(stream[idx]!==''){
        cell.textContent=stream[idx];
        cell.classList.add('hebrew-letter');
        letterCount++;
        cell.title=`Lettre n°${totalLetters - letterCount + 1} — ligne ${totalRows - r}`;
      } else cell.classList.add('empty');
      if(idx===mainIndex) cell.classList.add('highlight-main');
      row.appendChild(cell);
    }
    Array.from(row.children).reverse().forEach(c=>row.appendChild(c));
    rows.push(row);
  }
  rows.reverse().forEach(r=>container.appendChild(r));
}

// interaction slider + input
const sRange=document.getElementById('srange');
const sInput=document.getElementById('sinput');
sRange.addEventListener('input',e=>{sInput.value=e.target.value;renderGrid(+e.target.value);});
sInput.addEventListener('input',e=>{let v=+e.target.value;if(v<3)v=3;if(v>77)v=77;sRange.value=v;renderGrid(v);});
